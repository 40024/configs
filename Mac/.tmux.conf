# Enable mouse: click panes, resize, scroll
set -g mouse on
# Disable alternate screen so native scrollback/selection works
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'

# Let tmux set system clipboard via OSC 52
set -g set-clipboard on

# vi copy-mode: v starts selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
# vi copy-mode: y copies to macOS clipboard and exits
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# Mouse drag release copies to macOS clipboard and exits
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Extend name limit
set -g status-left-length 30
