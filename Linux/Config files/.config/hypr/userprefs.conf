# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information

# Angels
exec-once = signal-desktop
exec-once = tutanota-desktop

# Daemons
exec-once = xbindkeys &
exec-once = tmux has-session -t wlsunset 2>/dev/null || tmux new-session -d -s wlsunset 'wlsunset -l 37.3349 -L -122.0090 -t 2900 -T 6500 -g 1.0 -d 1800'
exec-once = awww-daemon
exec-once = python /home/v/bin/dynamic_wallpaper.py
exec-once = flatpak run com.github.wwmm.easyeffects --gapplication-service



# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░

input {
    force_no_accel = true
}

