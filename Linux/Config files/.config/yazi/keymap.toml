[[mgr.prepend_keymap]]
on = [ "j" ]
run = [ "leave", "shell --orphan 'pw-play /home/v/.local/share/Steam/steamapps/common/Aimbeast/Aimbeast/Trainer/Sounds/Hit3.ogg'" ]
desc = "Go to parent directory"

[[mgr.prepend_keymap]]
on = [ "k" ]
run = "arrow 1"
desc = "Move down"

[[mgr.prepend_keymap]]
on = [ "l" ]
run = "arrow -1"
desc = "Move up"

[[mgr.prepend_keymap]]
on = [ "p" ]
run = [ "enter", "shell --orphan 'pw-play /home/v/.local/share/Steam/steamapps/common/Aimbeast/Aimbeast/Trainer/Sounds/Hit3.ogg'" ]
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on = ";"
run = "paste"
desc = "Paste yanked files"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter directories or open files"

[[mgr.prepend_keymap]]
on = [ "<C-s>" ]
run = 'shell "$SHELL" --block'
desc = "Open shell in current directory"

[[mgr.prepend_keymap]]
on = "e"
run = "cd --interactive"
desc = "Jump to directory interactively"

[[mgr.prepend_keymap]]
on = ["c", "w"]
run = "shell -- cat %h | wl-copy"
desc = "Copy file contents"
