# Navigation/general binds
[[mgr.prepend_keymap]]
on = [ "j" ]
run = [ "leave", "shell --orphan 'pw-play /home/v/.local/share/Steam/steamapps/common/Aimbeast/Aimbeast/Trainer/Sounds/Hit3.ogg'" ]
desc = "Go to parent directory"

[[mgr.prepend_keymap]]
on = [ "k" ]
run = "arrow 1"
desc = "Move down"

[[mgr.prepend_keymap]]
on = [ "l" ]
run = "arrow -1"
desc = "Move up"

[[mgr.prepend_keymap]]
on = [ "p" ]
run = [ "enter", "shell --orphan 'pw-play /home/v/.local/share/Steam/steamapps/common/Aimbeast/Aimbeast/Trainer/Sounds/Hit3.ogg'" ]
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on = ";"
run = "paste"
desc = "Paste yanked files"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter directories or open files"

[[mgr.prepend_keymap]]
on = [ "<C-s>" ]
run = 'shell "$SHELL" --block'
desc = "Open shell in current directory"

[[mgr.prepend_keymap]]
on = "e"
run = "cd --interactive"
desc = "Jump to directory interactively"

[[mgr.prepend_keymap]]
on = ["c", "y"]
run = "shell -- cat %h | wl-copy"
desc = "Copy file contents"


# GVFS
[[mgr.prepend_keymap]]
on = [ "M", "m" ]
run = "plugin gvfs -- select-then-mount --jump"
desc = "Select device to mount and jump to its mount point"

[[mgr.prepend_keymap]]
on = [ "M", "u" ]
run = "plugin gvfs -- select-then-unmount"
desc = "Select device then unmount"

[[mgr.prepend_keymap]]
on = [ "M", "U" ]
run = "plugin gvfs -- select-then-unmount --eject"
desc = "Select device then eject"

[[mgr.prepend_keymap]]
on = [ "g", "m" ]
run = "plugin gvfs -- jump-to-device"
desc = "Select device then jump to its mount point"
