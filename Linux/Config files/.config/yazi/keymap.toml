[[mgr.prepend_keymap]]
on = [ "p" ]
run = "enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on = [ "j" ]
run = "leave"
desc = "Go to parent directory"

[[mgr.prepend_keymap]]
on = [ "l" ]
run = "arrow -1"
desc = "Move up"

[[mgr.prepend_keymap]]
on = [ "k" ]
run = "arrow 1"
desc = "Move down"

[[mgr.prepend_keymap]]
on = "<C-S-t>"
run = 'shell "$SHELL" --block'
desc = "Open shell in current directory"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter directories or open files"
